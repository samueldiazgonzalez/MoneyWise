<ion-header class="header-custom">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/transacciones"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ idEditar ? 'Editar' : 'Nueva' }} Transacción</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="form-content">

  <div class="tipo-selector">
    <button class="tipo-btn" [class.active-ingreso]="tipo === 'ingreso'" (click)="tipo = 'ingreso'">
      <ion-icon name="arrow-up-circle-outline"></ion-icon>
      Ingreso
    </button>
    <button class="tipo-btn" [class.active-gasto]="tipo === 'gasto'" (click)="tipo = 'gasto'">
      <ion-icon name="arrow-down-circle-outline"></ion-icon>
      Gasto
    </button>
  </div>

  <div class="monto-hero" [class.ingreso]="tipo === 'ingreso'" [class.gasto]="tipo === 'gasto'">
    <span class="currency-symbol">$</span>
    <input
      type="number"
      class="monto-input"
      placeholder="0.00"
      [(ngModel)]="monto"
      inputmode="decimal">
  </div>

  <div class="card-form">

    <div class="form-group">
      <label class="form-label">
        <ion-icon name="grid-outline"></ion-icon> Categoría
      </label>
      <ion-select
        [(ngModel)]="categoria"
        placeholder="Selecciona una categoría"
        interface="action-sheet"
        class="custom-select">
        <ion-select-option *ngFor="let c of categorias" [value]="c">{{c}}</ion-select-option>
      </ion-select>
    </div>

    <div class="form-group">
      <label class="form-label">
        <ion-icon name="document-text-outline"></ion-icon> Descripción
      </label>
      <ion-textarea
        placeholder="¿En qué gastaste o ingresaste? (opcional)"
        [(ngModel)]="descripcion"
        rows="3"
        class="custom-textarea">
      </ion-textarea>
    </div>

    <div class="comprobante-section">
      <label class="form-label">
        <ion-icon name="camera-outline"></ion-icon> Comprobante
      </label>

      <div class="foto-preview" *ngIf="comprobante" (click)="tomarFoto()">
        <img [src]="comprobante" alt="Comprobante">
        <div class="foto-overlay">
          <ion-icon name="camera-outline"></ion-icon>
          <span>Cambiar foto</span>
        </div>
      </div>

      <button class="btn-foto" *ngIf="!comprobante" (click)="tomarFoto()">
        <ion-icon name="camera-outline"></ion-icon>
        <span>Agregar comprobante</span>
      </button>
    </div>

  </div>

  <div class="footer-actions">
    <button class="btn-guardar" [class.ingreso]="tipo === 'ingreso'" [class.gasto]="tipo === 'gasto'" (click)="guardar()">
      <ion-icon name="checkmark-circle-outline"></ion-icon>
      {{ idEditar ? 'Actualizar' : 'Guardar' }} Transacción
    </button>
  </div>

</ion-content>
